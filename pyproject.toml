[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saihatsu-boushi"
version = "0.1.0"
description = "人工知能の誤りを再発防止の規則に変え、効いたかを確かめる道具"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
saihatsu = "saihatsu.cli:main"

[tool.setuptools]
packages = ["saihatsu"]
