<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原子間力顕微鏡 断面図</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#1d2733;--sub:#4c5968;--line:#d0d7df;--accent:#1f6feb;--err:#c62828}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo UI","Hiragino Sans","Noto Sans CJK JP",sans-serif;font-size:14px;line-height:1.4}
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;padding:6px}
.top{display:flex;flex-direction:column;gap:3px}
.top1{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.drop{display:flex;flex-direction:column;justify-content:center;align-items:center;border:2px dashed #8fa3ba;border-radius:8px;background:#fafcff;cursor:pointer;text-align:center;padding:2px 10px;min-height:42px;flex:0 0 auto;width:300px}
.drop:hover,.drop.over{background:#e8f1ff;border-color:var(--accent)}
.drop b{font-size:14px}
.drop span{font-size:14px;color:var(--sub)}
.drop input{display:none}
.btns{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.btns button{font:inherit;font-weight:700;border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:7px;padding:6px 14px;cursor:pointer;min-width:64px}
.btns button:hover{background:#eef5ff}
.btns button.on{background:var(--accent);color:#fff}
.btns button.back{border-color:#8a96a6;color:#33414f}
.btns button.mode{border-color:#2e7d32;color:#2e7d32;margin-left:6px}
.btns button.mode:hover{background:#eaf6ec}
.btns button.mode.on{background:#2e7d32;color:#fff}
.btns button.back.on{background:#6b7888;border-color:#6b7888;color:#fff}
.q{position:relative;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#dfe6ee;color:#33414f;font-weight:700;cursor:help;flex:none}
.q .tip{display:none;position:absolute;left:50%;top:30px;transform:translateX(-30%);width:420px;background:#14202e;color:#fff;border-radius:8px;padding:9px 12px;font-weight:400;font-size:14px;line-height:1.5;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.q:hover .tip,.q:focus .tip{display:block}
.scan{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.scan input{font:inherit;width:84px;border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.note{color:#8a5a00;font-weight:700}
.top2{display:flex;align-items:center;gap:12px;min-height:22px}
.status{flex:1 1 auto;background:#fff4e5;border:1.5px solid #f0b45a;color:#6b3f00;border-radius:6px;padding:2px 10px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.status.done{background:#e7f6ec;border-color:#6bbf8a;color:#14532d}
.red{color:var(--err);font-weight:700;flex:0 0 auto;white-space:nowrap}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;min-height:0}
.left{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:3px;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.imgcell{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#e4e9ef;border-radius:4px}
#cvImg{display:block;cursor:crosshair;touch-action:none}
#cv3d{display:none;cursor:grab;touch-action:none}
#cv3d:active{cursor:grabbing}
.ctl3{display:none;align-items:center;gap:8px;flex-wrap:wrap}
.ctl3 input[type=range]{width:130px}
.ctl3 button{font:inherit;border:1.5px solid #8a96a6;background:#fff;border-radius:6px;padding:1px 8px;cursor:pointer}
.bar{display:flex;align-items:center;gap:8px;color:var(--sub)}
.bar canvas{width:150px;height:12px;border:1px solid var(--line);border-radius:2px}
.right{display:flex;flex-direction:column;gap:6px;min-height:0}
#cards{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.lcard{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:2px}
.lhead{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.chip{width:16px;height:16px;border-radius:4px;border:1.5px solid #3a4655;flex:none}
.lname{font-weight:700;font-size:15px;flex:none}
.rd{flex:1 1 auto;display:flex;gap:12px;align-items:baseline;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0}
.rd .hintt{font-size:14px;font-weight:400;color:var(--sub)}
.lhead button{font:inherit;border:1.5px solid #8a96a6;background:#fff;border-radius:6px;padding:2px 8px;cursor:pointer;flex:none}
.lhead button:hover{background:#eef2f6}
.pc{flex:1 1 0;min-height:0}
.pc canvas{width:100%;height:100%;display:block;touch-action:none}
.noline{color:var(--sub);font-size:15px;padding:14px;text-align:center;flex:1 1 auto;display:flex;align-items:center;justify-content:center}
details{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fbfcfd}
summary{cursor:pointer;color:var(--sub)}
details label{display:flex;flex-direction:column;gap:3px;margin-top:6px}
details input,details select{font:inherit;border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#b71c1c;color:#fff;padding:8px 14px;border-radius:8px;max-width:86vw;z-index:40;display:none}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="top1">
      <label class="drop" id="drop" for="file">
        <b>ファイルをここに入れてください</b>
        <span>(.xqd、または数値の表。クリックでも選べます)</span>
        <input type="file" id="file" accept=".xqd,.xqdx,.txt,.csv,.tsv,.dat,.asc">
      </label>
      <div class="btns">
        <button id="b1">一次</button><button id="b2">二次</button><button id="b3">三次</button><button id="b0" class="back">元に戻す</button>
        <button id="b3d" class="mode" title="画像を立体にして、マウスで回して見ます">三次元で見る</button><span class="q" tabindex="0" aria-label="補正の説明">?<span class="tip">一次:画像全体の傾きだけを直します。二次:傾きに加えて、画像全体のゆるやかな反りも直します。三次:二次に加えて、ゆるやかなうねりも直します。ただし、ピラーの高さを実際より小さく見せる場合があります。ボタンは押した順に重ねて補正します(一次のあとに二次を押すと、一次の結果に二次を重ねます)。「元に戻す」で、重ねた補正がすべて消えます。ピラーの高さを測る前に、どれかを押してください</span></span>
      </div>
      <div class="scan"><span>走査範囲(マイクロメートル)</span><input type="number" id="scan" value="3.0" min="0" step="any"><span class="note" id="scanNote">必ず確認してください</span></div>
    </div>
    <div class="top2">
      <div class="status" id="status">ファイルを入れると、画像が表示されます。</div>
      <div class="red" id="zRed" style="display:none">高さの倍率は未確定です</div>
    </div>
  </div>

  <div class="main">
    <div class="left">
      <div class="imgcell" id="imgcell"><canvas id="cvImg" width="10" height="10"></canvas><canvas id="cv3d"></canvas></div>
      <div class="bar"><span id="cbMin">—</span><canvas id="cbar" width="150" height="12"></canvas><span id="cbMax">—</span><span>(色は高さ。単位: ナノメートル)</span><span class="ctl3" id="ctl3"><b>ドラッグで回転・ホイールで拡大縮小</b><span>高さの拡大</span><input type="range" id="zx" min="0.5" max="40" step="0.5" value="1"><b id="zxv">1.0 倍</b><button id="r3">視点を戻す</button></span></div>
    </div>
    <div class="right">
      <div id="cards"></div>
      <details id="detail"><summary>詳細</summary>
        <label>高さの倍率(表の値 1 が何ナノメートルか)<input type="number" id="zf" value="1" step="any" min="0"></label>
        <label id="smpRow" style="display:none">標本の使い方(.xqd のみ)
          <select id="smp"><option value="0" selected>偶数番目の標本だけ(256×256)</option><option value="1">奇数番目の標本だけ(256×256)</option><option value="2">2つを交互に並べる(512×256。横の画素は縦の半分)</option></select></label>
      </details>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== 計算の部分(画面に依存しない。tests/run_tests.js も同じコードを読み込んで確かめる) ===== */
const AFMCore = (function () {
  'use strict';

  // 多項式の項: x^i * y^j (i+j <= order)
  function polyTerms(order) {
    const t = [];
    for (let d = 0; d <= order; d++) for (let i = d; i >= 0; i--) t.push([i, d - i]);
    return t;
  }

  // 正規化した座標(-1〜1)。画素の中心を使う。
  function normCoord(k, n) {
    const h = (n - 1) / 2;
    return h > 0 ? (k - h) / h : 0;
  }

  function solveLinear(A, b, m) {
    // ガウスの消去法(部分ピボット選択)。A は m×m の Float64Array、b は長さ m。
    const M = new Float64Array(m * (m + 1));
    for (let i = 0; i < m; i++) {
      for (let j = 0; j < m; j++) M[i * (m + 1) + j] = A[i * m + j];
      M[i * (m + 1) + m] = b[i];
    }
    for (let c = 0; c < m; c++) {
      let p = c, best = Math.abs(M[c * (m + 1) + c]);
      for (let r = c + 1; r < m; r++) {
        const v = Math.abs(M[r * (m + 1) + c]);
        if (v > best) { best = v; p = r; }
      }
      if (best < 1e-12) throw new Error('補正の計算ができません(補正に使う範囲が狭すぎるか、一直線に並んでいます)');
      if (p !== c) for (let j = c; j <= m; j++) {
        const t = M[c * (m + 1) + j]; M[c * (m + 1) + j] = M[p * (m + 1) + j]; M[p * (m + 1) + j] = t;
      }
      for (let r = c + 1; r < m; r++) {
        const f = M[r * (m + 1) + c] / M[c * (m + 1) + c];
        if (f === 0) continue;
        for (let j = c; j <= m; j++) M[r * (m + 1) + j] -= f * M[c * (m + 1) + j];
      }
    }
    const x = new Float64Array(m);
    for (let i = m - 1; i >= 0; i--) {
      let s = M[i * (m + 1) + m];
      for (let j = i + 1; j < m; j++) s -= M[i * (m + 1) + j] * x[j];
      x[i] = s / M[i * (m + 1) + i];
    }
    return x;
  }

  // 最小二乗法で、座標 x,y の order 次までの多項式をあてはめる。mask が null なら画像全体。
  function fitPolynomial(z, W, H, mask, order) {
    const terms = polyTerms(order), m = terms.length;
    const A = new Float64Array(m * m), b = new Float64Array(m), phi = new Float64Array(m);
    const px = new Float64Array(order + 1), py = new Float64Array(order + 1);
    let n = 0;
    for (let y = 0; y < H; y++) {
      const Y = normCoord(y, H);
      py[0] = 1; for (let k = 1; k <= order; k++) py[k] = py[k - 1] * Y;
      for (let x = 0; x < W; x++) {
        const idx = y * W + x;
        if (mask && !mask[idx]) continue;
        const v = z[idx];
        if (!isFinite(v)) continue;
        const X = normCoord(x, W);
        px[0] = 1; for (let k = 1; k <= order; k++) px[k] = px[k - 1] * X;
        for (let t = 0; t < m; t++) phi[t] = px[terms[t][0]] * py[terms[t][1]];
        for (let i = 0; i < m; i++) {
          b[i] += phi[i] * v;
          for (let j = 0; j < m; j++) A[i * m + j] += phi[i] * phi[j];
        }
        n++;
      }
    }
    if (n < m * 3) throw new Error('補正に使う画素が少なすぎます(' + n + ' 個)。範囲を広げてください');
    return { coef: solveLinear(A, b, m), terms, order, n };
  }

  function evalPolynomial(fit, W, H) {
    const out = new Float64Array(W * H), { coef, terms, order } = fit;
    const px = new Float64Array(order + 1), py = new Float64Array(order + 1);
    for (let y = 0; y < H; y++) {
      const Y = normCoord(y, H);
      py[0] = 1; for (let k = 1; k <= order; k++) py[k] = py[k - 1] * Y;
      for (let x = 0; x < W; x++) {
        const X = normCoord(x, W);
        px[0] = 1; for (let k = 1; k <= order; k++) px[k] = px[k - 1] * X;
        let s = 0;
        for (let t = 0; t < terms.length; t++) s += coef[t] * px[terms[t][0]] * py[terms[t][1]];
        out[y * W + x] = s;
      }
    }
    return out;
  }

  // 四角形(x0,y0 を含み x1,y1 を含まない。画素単位)から、画素ごとの印を作る。
  function rectsMask(rects, W, H) {
    const m = new Uint8Array(W * H);
    for (const r of rects) {
      const x0 = Math.max(0, Math.round(Math.min(r.x0, r.x1))), x1 = Math.min(W, Math.round(Math.max(r.x0, r.x1)));
      const y0 = Math.max(0, Math.round(Math.min(r.y0, r.y1))), y1 = Math.min(H, Math.round(Math.max(r.y0, r.y1)));
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) m[y * W + x] = 1;
    }
    return m;
  }

  function maskMean(z, mask) {
    let s = 0, n = 0;
    for (let i = 0; i < z.length; i++) if ((!mask || mask[i]) && isFinite(z[i])) { s += z[i]; n++; }
    return n ? s / n : NaN;
  }

  // 傾き補正。fitMask が null なら画像全体で補正。
  // shiftMask: null なら「補正に使った範囲の平均を 0」、配列なら「その範囲の平均を 0」。
  function flatten(z, W, H, fitMask, order, shiftMask) {
    const fit = fitPolynomial(z, W, H, fitMask, order);
    const surf = evalPolynomial(fit, W, H);
    const out = new Float64Array(W * H);
    for (let i = 0; i < out.length; i++) out[i] = z[i] - surf[i];
    const shift = maskMean(out, shiftMask || fitMask);
    for (let i = 0; i < out.length; i++) out[i] -= shift;
    let smin = Infinity, smax = -Infinity;
    for (let i = 0; i < surf.length; i++) { if (surf[i] < smin) smin = surf[i]; if (surf[i] > smax) smax = surf[i]; }
    return { out, fit, surfaceRange: smax - smin, usedPixels: fit.n, shift };
  }

  function rectBounds(r, W, H) {
    return {
      x0: Math.max(0, Math.round(Math.min(r.x0, r.x1))), x1: Math.min(W, Math.round(Math.max(r.x0, r.x1))),
      y0: Math.max(0, Math.round(Math.min(r.y0, r.y1))), y1: Math.min(H, Math.round(Math.max(r.y0, r.y1)))
    };
  }

  // 四角形(null なら画像全体)の中の値を配列で返す
  function valuesIn(z, W, H, rect) {
    const b = rect ? rectBounds(rect, W, H) : { x0: 0, x1: W, y0: 0, y1: H };
    const v = [];
    for (let y = b.y0; y < b.y1; y++) for (let x = b.x0; x < b.x1; x++) { const t = z[y * W + x]; if (isFinite(t)) v.push(t); }
    return v;
  }

  // 表面粗さ。算術平均粗さ = 平均からのずれの絶対値の平均。二乗平均平方根粗さ = ずれの二乗の平均の平方根。
  function roughness(z, W, H, rect) {
    const v = valuesIn(z, W, H, rect), n = v.length;
    if (!n) return { n: 0, mean: NaN, sa: NaN, sq: NaN, sz: NaN, max: NaN, min: NaN };
    let s = 0, mn = Infinity, mx = -Infinity;
    for (const t of v) { s += t; if (t < mn) mn = t; if (t > mx) mx = t; }
    const mean = s / n;
    let a = 0, q = 0;
    for (const t of v) { const d = t - mean; a += Math.abs(d); q += d * d; }
    return { n, mean, sa: a / n, sq: Math.sqrt(q / n), sz: mx - mn, max: mx, min: mn };
  }

  // 方法(ア): 頂上の範囲と床の範囲の、平均の差
  function heightByRects(z, W, H, topRect, floorRect) {
    const t = roughness(z, W, H, topRect), f = roughness(z, W, H, floorRect);
    return { top: t.mean, floor: f.mean, height: t.mean - f.mean, topSd: t.sq, floorSd: f.sq, nTop: t.n, nFloor: f.n };
  }

  function percentile(sorted, p) {
    if (!sorted.length) return NaN;
    const k = (sorted.length - 1) * p, i = Math.floor(k), f = k - i;
    return i + 1 < sorted.length ? sorted[i] * (1 - f) + sorted[i + 1] * f : sorted[i];
  }

  function makeHistogram(values, bins, lo, hi) {
    const counts = new Float64Array(bins), w = (hi - lo) / bins;
    for (const v of values) {
      if (v < lo || v > hi) continue;
      let k = Math.floor((v - lo) / w); if (k >= bins) k = bins - 1;
      counts[k]++;
    }
    return { counts, lo, hi, width: w, bins };
  }

  function smoothCounts(c, sigmaBins) {
    const n = c.length, r = Math.ceil(sigmaBins * 3), k = [];
    let ks = 0;
    for (let i = -r; i <= r; i++) { const w = Math.exp(-0.5 * (i / sigmaBins) ** 2); k.push(w); ks += w; }
    const out = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0;
      for (let j = -r; j <= r; j++) { const q = i + j; if (q >= 0 && q < n) s += c[q] * k[j + r]; }
      out[i] = s / ks;
    }
    return out;
  }

  function otsuIndex(counts) {
    let total = 0, sumAll = 0;
    for (let i = 0; i < counts.length; i++) { total += counts[i]; sumAll += i * counts[i]; }
    let wB = 0, sumB = 0, best = -1, bestT = 0;
    for (let t = 0; t < counts.length - 1; t++) {
      wB += counts[t]; sumB += t * counts[t];
      const wF = total - wB;
      if (wB === 0 || wF === 0) continue;
      const mB = sumB / wB, mF = (sumAll - sumB) / wF;
      const between = wB * wF * (mB - mF) ** 2;
      if (between > best) { best = between; bestT = t; }
    }
    return bestT;
  }

  // 山の中心: 山の頂上から半値幅の範囲を、度数で重みを付けた平均で求める
  function peakCentroid(raw, smooth, from, to, lo, width) {
    let pk = from;
    for (let i = from; i <= to; i++) if (smooth[i] > smooth[pk]) pk = i;
    const half = smooth[pk] * 0.5;
    let a = pk, b = pk;
    while (a - 1 >= from && smooth[a - 1] >= half) a--;
    while (b + 1 <= to && smooth[b + 1] >= half) b++;
    let s = 0, w = 0;
    for (let i = a; i <= b; i++) { s += (lo + (i + 0.5) * width) * raw[i]; w += raw[i]; }
    return { center: w ? s / w : lo + (pk + 0.5) * width, peakBin: pk, from: a, to: b, peakCount: smooth[pk] };
  }

  // 方法(イ): ヒストグラムの床の山と頂上の山の差(推定)
  function heightAuto(z, W, H, rect) {
    const v = valuesIn(z, W, H, rect);
    if (v.length < 100) throw new Error('画素が少なすぎます');
    const sorted = Float64Array.from(v).sort();
    const lo = percentile(sorted, 0.002), hi = percentile(sorted, 0.998);
    if (!(hi > lo)) throw new Error('高さにばらつきがありません');
    const bins = 256, hist = makeHistogram(v, bins, lo, hi);
    const smooth = smoothCounts(hist.counts, 2);
    const t = otsuIndex(smooth);
    const floorPk = peakCentroid(hist.counts, smooth, 0, t, lo, hist.width);
    const topPk = peakCentroid(hist.counts, smooth, t + 1, bins - 1, lo, hist.width);
    return {
      floor: floorPk.center, top: topPk.center, height: topPk.center - floorPk.center,
      threshold: lo + (t + 1) * hist.width, hist, smooth, floorPeak: floorPk, topPeak: topPk,
      midpoint: (floorPk.center + topPk.center) / 2
    };
  }

  function boxSmooth3(z, W, H) {
    const out = new Float64Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
        s += z[yy * W + xx]; n++;
      }
      out[y * W + x] = s / n;
    }
    return out;
  }

  // 高さの中間値で二値化し、ピラーの個数と中心間の間隔を求める。

    if (L.marks.length === 0) { L.marks.push({ d: toD(p.x) }); L.pend = { x: p.x }; }           // 押した場所が、区間の始まり(点1)。そのままドラッグすると、点2が伸びる
    else { L.marks.push({ d: toD(p.x) }); L.dragM = 1; }
    redraw();
  });
  cv.addEventListener('pointermove', e => {
    if (!L.geom || !L.prof) return; const p = pt(e);
    if (L.dragM >= 0) { L.marks[L.dragM].d = toD(p.x); redraw(); return; }
    if (L.pend) { if (Math.abs(p.x - L.pend.x) > 3) { L.marks.push({ d: toD(p.x) }); L.dragM = 1; L.pend = null; cv.style.cursor = 'ew-resize'; } redraw(); return; }
    const k = hit(p); if (k !== L.hover) { L.hover = k; drawProfile(L); }
    cv.style.cursor = k >= 0 ? 'ew-resize' : (L.marks.length < 2 ? 'crosshair' : 'default');
  });
  const up = () => { if (L.dragM >= 0 || L.pend) { L.dragM = -1; L.pend = null; cv.style.cursor = L.hover >= 0 ? 'ew-resize' : (L.marks.length < 2 ? 'crosshair' : 'default'); redraw(); } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { if (L.hover >= 0 && L.dragM < 0) { L.hover = -1; drawProfile(L); } });
}
function renderCards() {
  const box = $('cards'); box.innerHTML = '';
  if (!S.lines.length) { const d = document.createElement('div'); d.className = 'card noline'; d.id = 'noline'; d.textContent = S.orig ? '画像の上でドラッグして、線を引いてください(3本まで。それぞれの断面図が出ます)' : 'ファイルを入れると、画像の上に線を引けます'; box.appendChild(d); return; }
  linesSorted().forEach(L => {
    const n = L.slot + 1, c = document.createElement('div'); c.className = 'card lcard'; c.id = 'card' + n;
    c.innerHTML = '<div class="lhead"><span class="chip"></span><span class="lname">線' + n + '</span><span class="rd"><span class="hintt" id="hint' + n + '"></span><span id="hv' + n + '"></span><span id="dv' + n + '"></span></span><button id="redo' + n + '">2点をやり直す</button><button id="del' + n + '" title="この線を消す">線を消す</button></div><div class="pc"><canvas id="cvProf' + n + '"></canvas></div>';
    c.querySelector('.chip').style.background = LCOL[L.slot]; box.appendChild(c);
    L.cv = c.querySelector('canvas'); L.el = { hint: c.querySelector('#hint' + n), hv: c.querySelector('#hv' + n), dv: c.querySelector('#dv' + n) };
    c.querySelector('#redo' + n).addEventListener('click', () => { L.marks = []; L.hover = -1; L.dragM = -1; drawProfile(L); drawImage(); });
    c.querySelector('#del' + n).addEventListener('click', () => { S.lines = S.lines.filter(q => q !== L); renderCards(); drawImage(); });
    attachProf(L);
  });
  drawProfiles();
}

function refresh() {
  const st = $('status'); st.textContent = statusText(); st.classList.toggle('done', !!S.order);
  [['b1', 1], ['b2', 2], ['b3', 3]].forEach(([id, o]) => $(id).classList.toggle('on', S.hist.includes(o))); $('b0').classList.toggle('on', !!S.orig && !S.order);
  clampMarks(); drawBar(); drawImage(); renderCards();
}
let rz = 0; const relayout = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (S.orig) drawImage(); drawProfiles(); }); };
window.addEventListener('resize', relayout);
if (window.ResizeObserver) new ResizeObserver(relayout).observe($('imgcell'));
drawBar(); renderCards();
const LN = i => linesSorted()[i || 0];
window.AFMSimple = {
  S, V3, core: AFMCore, geom: i => LN(i).geom, prof: i => LN(i).prof, scales: () => ({ sx, sy }), marks: i => LN(i).marks.map(m => ({ d: m.d })), count: () => S.lines.length,
  profileClient: (d, h, i) => { const L = LN(i), b = L.cv.getBoundingClientRect(); return { x: b.left + L.geom.X(d), y: b.top + L.geom.Y(h === undefined ? hAtL(L, d) : h) }; },
  hAt: (d, i) => hAtL(LN(i), d)
};
})();
</script>
